# .github/workflows/scheduler.yml

name: Scheduled Crawler

on:
  workflow_dispatch:
    inputs:
      task_to_run:
        description: 'Scheduled Task ID (TASK_1, TASK_2, or TASK_3) or Manual Run'
        required: true
        type: choice
        default: 'TASK_1'
        options:
          - TASK_1
          - TASK_2
          - TASK_3
          - TASK_4

permissions:
  contents: write # 授予写入权限用于提交数据 (用于 PyGithub commit 和 git-auto-commit-action)

jobs:
  # T1: 任务 1 Job 定义
  run_task_1:
    name: "TASK 1: 所有招采"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'TASK_1'
    steps:
      - name: Checkout code for Local Action Access
        uses: actions/checkout@v5
      - name: Execute Composite Action for TASK_1
        uses: ./.github/actions/sop
        with:
          task_name: TASK_1

  # T2: 任务 2 Job 定义
  run_task_2:
    name: "TASK 2: 所有招采_正在招标"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task_to_run == 'TASK_2'
    steps:
      - name: Checkout code for Local Action Access
        uses: actions/checkout@v5
      - name: Execute Composite Action for TASK_2
        uses: ./.github/actions/sop
        with:
          task_name: TASK_2

  # T3: 统一处理 TASK 3 和 TASK 4 的差异化推送与状态管理
  run_task_diff_push:
    name: "TASK ${{ github.event.inputs.task_to_run }}: 差异化推送与状态管理"
    runs-on: ubuntu-latest
    # 捕获 TASK_3 或 TASK_4
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.task_to_run == 'TASK_3' || github.event.inputs.task_to_run == 'TASK_4')
      
    steps:
      - name: Checkout code (Fetch Full History for State Management)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 必须获取全部历史以供 crawler.py 读取旧状态文件

      - name: Setup Python and Install dependencies
        # 重用 sop Action 的 Python 设置和依赖安装步骤
        uses: ./.github/actions/sop
        with:
          # 传递一个虚拟任务名以满足输入要求，但只执行 setup 和 install 步骤
          task_name: DUMMY 

      - name: Run Crawler, Compare, and Push (TASK ${{ github.event.inputs.task_to_run }})
        shell: bash
        # 运行爬虫，将任务键作为参数传入
        run: python crawler.py ${{ github.event.inputs.task_to_run }}
        env:
          # 注入 Secrets 供 crawler.py 访问
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }} # Server Chan API URL
          GITHUB_OWNER: ${{ github.repository_owner }} 
          GITHUB_REPO: ${{ github.event.repository.name }}

      - name: Commit and Push Local Data Files (Streamlit and State)
        # 提交所有必要的 JSON 文件，包括 TASK 3 和 TASK 4 的状态文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "SCHEDULER: Auto-update data [${{ github.event.inputs.task_to_run }}] for Streamlit/State."
          # 提交模式只需要匹配 zgyd/*.json 和 zgyd/metadata.json 即可，因为状态文件也符合 zgyd/*.json 模式
          file_pattern: 'zgyd/*.json zgyd/metadata.json' 
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          push_options: '--force-with-lease'